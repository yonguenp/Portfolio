<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="greenStarGrad" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#aaffaa"/>
      <stop offset="35%" stop-color="#00cc44"/>
      <stop offset="100%" stop-color="#006622"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#44ff88" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00cc44" stop-opacity="0"/>
    </radialGradient>
    <filter id="starGlowGreen">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 외부 발광 -->
  <circle cx="32" cy="32" r="30" fill="url(#greenGlow)"/>

  <!-- 별 모양 (5각) -->
  <polygon points="32,4 39,24 60,24 44,37 50,58 32,46 14,58 20,37 4,24 25,24"
           fill="url(#greenStarGrad)" stroke="#009933" stroke-width="1.5" stroke-linejoin="round"
           filter="url(#starGlowGreen)"/>

  <!-- 광택 테두리 -->
  <polygon points="32,7 37.5,23 54,23 40.5,33.5 46,52 32,43 18,52 23.5,33.5 10,23 26.5,23"
           fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.3" stroke-linejoin="round"/>

  <!-- 중앙 밝은 하이라이트 -->
  <ellipse cx="27" cy="24" rx="7" ry="5" fill="white" fill-opacity="0.4" transform="rotate(-20, 27, 24)"/>
</svg>
