<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <!-- 원형 배경 그라디언트 -->
    <radialGradient id="pauseBgGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%"  stop-color="#4455aa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#111133" stop-opacity="0.75"/>
    </radialGradient>
    <!-- 테두리 그라디언트 -->
    <linearGradient id="pauseBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#9999ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3344aa" stop-opacity="0.7"/>
    </linearGradient>
    <!-- 바 그라디언트 -->
    <linearGradient id="pauseBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#aabbee"/>
    </linearGradient>
    <!-- 글로우 필터 -->
    <filter id="pauseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="gblur"/>
      <feFlood flood-color="#8888ff" flood-opacity="0.5" result="glowColor"/>
      <feComposite in="glowColor" in2="gblur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 반투명 원형 배경 -->
  <circle cx="30" cy="30" r="27"
          fill="url(#pauseBgGrad)"
          stroke="url(#pauseBorderGrad)" stroke-width="1.8"/>

  <!-- 내부 하이라이트 반원 -->
  <path d="M 12,30 A 18,18 0 0,1 48,30"
        fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.25"/>

  <!-- pause 바 왼쪽 -->
  <rect x="17" y="17" width="9" height="26" rx="3" ry="3"
        fill="url(#pauseBarGrad)"
        stroke="#8899cc" stroke-width="0.5"
        filter="url(#pauseGlow)"/>

  <!-- pause 바 오른쪽 -->
  <rect x="34" y="17" width="9" height="26" rx="3" ry="3"
        fill="url(#pauseBarGrad)"
        stroke="#8899cc" stroke-width="0.5"
        filter="url(#pauseGlow)"/>
</svg>
