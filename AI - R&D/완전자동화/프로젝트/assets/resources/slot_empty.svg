<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <radialGradient id="slotEmptyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0a2e" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#000008" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="emptyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 배경 원 -->
  <circle cx="20" cy="20" r="18" fill="url(#slotEmptyBg)"/>
  <!-- 점선 테두리 원 -->
  <circle cx="20" cy="20" r="17" fill="none"
          stroke="#4466aa" stroke-width="1.5"
          stroke-dasharray="4 3" stroke-linecap="round"
          opacity="0.75" filter="url(#emptyGlow)"/>
  <!-- 내부 미세 점선 원 (두 번째 원) -->
  <circle cx="20" cy="20" r="12" fill="none"
          stroke="#2a3a66" stroke-width="1"
          stroke-dasharray="2 4" stroke-linecap="round"
          opacity="0.5"/>
  <!-- 중앙 작은 점 -->
  <circle cx="20" cy="20" r="2" fill="#4466aa" opacity="0.4"/>
</svg>
