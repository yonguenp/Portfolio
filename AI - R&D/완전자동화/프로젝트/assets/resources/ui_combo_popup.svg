<svg xmlns="http://www.w3.org/2000/svg" width="300" height="80" viewBox="0 0 300 80">
  <defs>
    <!-- 배경 글로우 그라디언트 -->
    <radialGradient id="comboBgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#ffe844" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ff9900" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <!-- 배경 패널 그라디언트 -->
    <linearGradient id="comboPanelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#3a2000"/>
      <stop offset="50%" stop-color="#1a0e00"/>
      <stop offset="100%" stop-color="#0a0600"/>
    </linearGradient>
    <!-- 황금 테두리 그라디언트 -->
    <linearGradient id="comboBorderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffe866"/>
      <stop offset="50%" stop-color="#ffc800"/>
      <stop offset="100%" stop-color="#b87800"/>
    </linearGradient>
    <!-- 텍스트 황금 그라디언트 -->
    <linearGradient id="comboTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#fffaaa"/>
      <stop offset="40%" stop-color="#ffe844"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <!-- 외부 글로우 필터 -->
    <filter id="comboGlowFilter" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="textGlow" x="-15%" y="-40%" width="130%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="gblur"/>
      <feFlood flood-color="#ffcc00" flood-opacity="0.8" result="glowColor"/>
      <feComposite in="glowColor" in2="gblur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 외부 글로우 후광 -->
  <ellipse cx="150" cy="40" rx="148" ry="38" fill="url(#comboBgGlow)"/>

  <!-- 메인 패널 배경 (둥근 사각형) -->
  <rect x="4" y="8" width="292" height="64" rx="14" ry="14"
        fill="url(#comboPanelGrad)" stroke="url(#comboBorderGrad)" stroke-width="2.5" opacity="0.97"/>

  <!-- 내부 하이라이트 라인 -->
  <rect x="6" y="9.5" width="288" height="28" rx="12" ry="12"
        fill="none" stroke="#ffe866" stroke-width="0.8" opacity="0.3"/>

  <!-- 좌측 별 장식 -->
  <g transform="translate(28,40)" filter="url(#comboGlowFilter)">
    <polygon points="0,-11 2.5,-4 9.5,-4 4,0.5 6,7.5 0,3.5 -6,7.5 -4,0.5 -9.5,-4 -2.5,-4"
             fill="#ffe844" stroke="#ff9900" stroke-width="0.8" opacity="0.95"/>
    <polygon points="0,-6 1.5,-2 5.5,-2 2.5,0.5 3.5,4.5 0,2 -3.5,4.5 -2.5,0.5 -5.5,-2 -1.5,-2"
             fill="#fffaaa" opacity="0.7"/>
  </g>

  <!-- 우측 별 장식 -->
  <g transform="translate(272,40)" filter="url(#comboGlowFilter)">
    <polygon points="0,-11 2.5,-4 9.5,-4 4,0.5 6,7.5 0,3.5 -6,7.5 -4,0.5 -9.5,-4 -2.5,-4"
             fill="#ffe844" stroke="#ff9900" stroke-width="0.8" opacity="0.95"/>
    <polygon points="0,-6 1.5,-2 5.5,-2 2.5,0.5 3.5,4.5 0,2 -3.5,4.5 -2.5,0.5 -5.5,-2 -1.5,-2"
             fill="#fffaaa" opacity="0.7"/>
  </g>

  <!-- 소형 스파클 (좌) -->
  <g transform="translate(52,20)" opacity="0.8">
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#ffe844" stroke-width="1.2"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#ffe844" stroke-width="1.2"/>
    <line x1="-3" y1="-3" x2="3" y2="3" stroke="#ffe844" stroke-width="0.7"/>
    <line x1="3" y1="-3" x2="-3" y2="3" stroke="#ffe844" stroke-width="0.7"/>
  </g>
  <!-- 소형 스파클 (우) -->
  <g transform="translate(248,20)" opacity="0.8">
    <line x1="-4" y1="0" x2="4" y2="0" stroke="#ffe844" stroke-width="1.2"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke="#ffe844" stroke-width="1.2"/>
    <line x1="-3" y1="-3" x2="3" y2="3" stroke="#ffe844" stroke-width="0.7"/>
    <line x1="3" y1="-3" x2="-3" y2="3" stroke="#ffe844" stroke-width="0.7"/>
  </g>
  <!-- 소형 스파클 (우하) -->
  <g transform="translate(255,58)" opacity="0.6">
    <line x1="-3" y1="0" x2="3" y2="0" stroke="#ffcc44" stroke-width="1"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#ffcc44" stroke-width="1"/>
  </g>

  <!-- "COMBO" 텍스트 -->
  <text x="118" y="37"
        font-family="Arial Black, Arial, sans-serif"
        font-size="20" font-weight="900"
        fill="url(#comboTextGrad)"
        stroke="#7a4000" stroke-width="2.5"
        paint-order="stroke"
        text-anchor="middle"
        filter="url(#textGlow)"
        letter-spacing="2">COMBO</text>

  <!-- "×1.5!" 텍스트 -->
  <text x="220" y="37"
        font-family="Arial Black, Arial, sans-serif"
        font-size="22" font-weight="900"
        fill="url(#comboTextGrad)"
        stroke="#7a4000" stroke-width="2.5"
        paint-order="stroke"
        text-anchor="middle"
        filter="url(#textGlow)"
        letter-spacing="1">×1.5!</text>

  <!-- 하단 서브 텍스트 -->
  <text x="150" y="60"
        font-family="Arial, sans-serif"
        font-size="10" font-weight="700"
        fill="#ffcc44"
        text-anchor="middle"
        opacity="0.85"
        letter-spacing="3">SCORE MULTIPLIER ACTIVE</text>
</svg>
