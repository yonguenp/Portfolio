<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="unlockedBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a1050"/>
      <stop offset="60%" stop-color="#0a0a2e"/>
      <stop offset="100%" stop-color="#050518"/>
    </radialGradient>
    <linearGradient id="goldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe866"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#ffc800"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <linearGradient id="innerGoldFrame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe866" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6644ff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#4422dd" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000008" stop-opacity="0"/>
    </radialGradient>
    <filter id="frameGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect x="4" y="4" width="112" height="112" rx="10" ry="10" fill="url(#unlockedBg)"/>

  <!-- 중앙 글로우 -->
  <ellipse cx="60" cy="58" rx="45" ry="40" fill="url(#centerGlow)"/>

  <!-- 황금 외곽 프레임 -->
  <rect x="4" y="4" width="112" height="112" rx="10" ry="10"
        fill="none" stroke="url(#goldFrame)" stroke-width="2.5"
        filter="url(#frameGlow)" opacity="0.95"/>

  <!-- 내부 이중 프레임 -->
  <rect x="9" y="9" width="102" height="102" rx="8" ry="8"
        fill="none" stroke="url(#innerGoldFrame)" stroke-width="1" opacity="0.7"/>

  <!-- 코너 장식 (4곳) -->
  <g fill="url(#goldFrame)" filter="url(#sparkleGlow)" opacity="0.9">
    <!-- 좌상 -->
    <polygon points="10,10 16,10 10,16"/>
    <polygon points="12,8 14,4 16,8 14,12"/>
    <!-- 우상 -->
    <polygon points="110,10 104,10 110,16"/>
    <polygon points="108,8 106,4 104,8 106,12"/>
    <!-- 좌하 -->
    <polygon points="10,110 16,110 10,104"/>
    <polygon points="12,112 14,116 16,112 14,108"/>
    <!-- 우하 -->
    <polygon points="110,110 104,110 110,104"/>
    <polygon points="108,112 106,116 104,112 106,108"/>
  </g>

  <!-- 중앙 별 + 빛 방사 -->
  <g transform="translate(60, 56)" filter="url(#sparkleGlow)">
    <!-- 외부 빛 방사선 -->
    <line x1="0" y1="-38" x2="0" y2="-28" stroke="#ffe866" stroke-width="1.2" opacity="0.6"/>
    <line x1="0" y1="28" x2="0" y2="38" stroke="#ffe866" stroke-width="1.2" opacity="0.6"/>
    <line x1="-38" y1="0" x2="-28" y2="0" stroke="#ffe866" stroke-width="1.2" opacity="0.6"/>
    <line x1="28" y1="0" x2="38" y2="0" stroke="#ffe866" stroke-width="1.2" opacity="0.6"/>
    <line x1="-27" y1="-27" x2="-20" y2="-20" stroke="#ffc800" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="-20" x2="27" y2="-27" stroke="#ffc800" stroke-width="1" opacity="0.5"/>
    <line x1="-27" y1="27" x2="-20" y2="20" stroke="#ffc800" stroke-width="1" opacity="0.5"/>
    <line x1="20" y1="20" x2="27" y2="27" stroke="#ffc800" stroke-width="1" opacity="0.5"/>

    <!-- 외부 원 광채 -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#ffd700" stroke-width="0.8" opacity="0.3"/>
    <circle cx="0" cy="0" r="22" fill="#6644ff" opacity="0.1"/>

    <!-- 8각 별 -->
    <polygon points="0,-18 3.5,-7 12,-12 7,-3 18,0 7,3 12,12 3.5,7 0,18 -3.5,7 -12,12 -7,3 -18,0 -7,-3 -12,-12 -3.5,-7"
             fill="url(#goldFrame)"/>
    <!-- 중앙 원 -->
    <circle cx="0" cy="0" r="5.5" fill="#ffe866"/>
    <circle cx="0" cy="0" r="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- 하단 소형 스파클 3개 -->
  <g filter="url(#sparkleGlow)">
    <polygon points="42,96 44,91 46,96 44,101" fill="#ffc800" opacity="0.7"/>
    <polygon points="58,93 60,87 62,93 60,99" fill="#ffe866" opacity="0.9"/>
    <polygon points="74,96 76,91 78,96 76,101" fill="#ffc800" opacity="0.7"/>
  </g>

  <!-- 배경 별들 (소형, 희미) -->
  <circle cx="22" cy="28" r="1" fill="#b8ccff" opacity="0.5"/>
  <circle cx="97" cy="32" r="1" fill="#ffffff" opacity="0.4"/>
  <circle cx="18" cy="88" r="0.8" fill="#b8ccff" opacity="0.4"/>
  <circle cx="100" cy="84" r="1" fill="#ffffff" opacity="0.5"/>
  <circle cx="30" cy="60" r="0.7" fill="#b8ccff" opacity="0.3"/>
  <circle cx="90" cy="58" r="0.8" fill="#ffffff" opacity="0.35"/>
</svg>
