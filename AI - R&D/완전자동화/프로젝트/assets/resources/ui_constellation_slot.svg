<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <radialGradient id="slotGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1050" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#050320" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="slotGlowEmpty" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4466ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0022aa" stop-opacity="0"/>
    </radialGradient>
    <filter id="slotGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 외부 발광 (빈 슬롯) -->
  <circle cx="20" cy="20" r="18" fill="url(#slotGlowEmpty)"/>

  <!-- 슬롯 배경 원 -->
  <circle cx="20" cy="20" r="16" fill="url(#slotGrad)"/>

  <!-- 외곽 링 (점선으로 빈 슬롯 표현) -->
  <circle cx="20" cy="20" r="16" fill="none"
          stroke="#6688cc" stroke-width="1.8"
          stroke-dasharray="4 3"
          stroke-dashoffset="0"
          filter="url(#slotGlow)"/>

  <!-- 내부 작은 별 실루엣 (빈 상태 표시) -->
  <polygon points="20,11 21.8,16.8 28,16.8 23,20.2 24.8,26 20,22.5 15.2,26 17,20.2 12,16.8 18.2,16.8"
           fill="none" stroke="#445588" stroke-width="1.2" stroke-linejoin="round"
           fill-opacity="0.3"/>

  <!-- 중앙 작은 점 -->
  <circle cx="20" cy="20" r="1.5" fill="#4466aa" fill-opacity="0.6"/>
</svg>
