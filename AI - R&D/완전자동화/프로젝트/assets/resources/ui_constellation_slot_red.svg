<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <radialGradient id="slotRedBg" cx="40%" cy="35%" r="65%">
      <stop offset="0%"  stop-color="#ff9090"/>
      <stop offset="55%" stop-color="#ff2020"/>
      <stop offset="100%" stop-color="#880000"/>
    </radialGradient>
    <radialGradient id="slotRedOuter" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#ff4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#cc0000" stop-opacity="0"/>
    </radialGradient>
    <filter id="slotRedGlow">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feFlood flood-color="#ff2020" flood-opacity="0.5" result="gc"/>
      <feComposite in="gc" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 외부 글로우 -->
  <circle cx="20" cy="20" r="18" fill="url(#slotRedOuter)"/>
  <!-- 배경 원 -->
  <circle cx="20" cy="20" r="16" fill="#200808"/>
  <!-- 채워진 내부 원 -->
  <circle cx="20" cy="20" r="14" fill="url(#slotRedBg)" filter="url(#slotRedGlow)"/>
  <!-- 외곽 테두리 -->
  <circle cx="20" cy="20" r="16" fill="none" stroke="#cc0000" stroke-width="2"/>
  <!-- 하이라이트 -->
  <ellipse cx="16" cy="14" rx="3.5" ry="2.5" fill="#ffffff" opacity="0.22"/>
  <!-- 중앙 별 -->
  <polygon points="20,13 21.5,17.5 26.5,17.5 22.5,20.5 24,25 20,22 16,25 17.5,20.5 13.5,17.5 18.5,17.5"
           fill="#ffffff" opacity="0.50"/>
</svg>
