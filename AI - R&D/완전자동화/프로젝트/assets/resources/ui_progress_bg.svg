<svg xmlns="http://www.w3.org/2000/svg" width="120" height="12" viewBox="0 0 120 12">
  <defs>
    <linearGradient id="progressBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a55" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#111133" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="bgInnerShadow" x="-2%" y="-10%" width="104%" height="120%">
      <feGaussianBlur stdDeviation="0.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 바깥 테두리 -->
  <rect x="0" y="0" width="120" height="12" rx="6" ry="6"
        fill="#0a0a22" opacity="0.7"/>
  <!-- 배경 트랙 -->
  <rect x="1" y="1" width="118" height="10" rx="5" ry="5"
        fill="url(#progressBgGrad)" filter="url(#bgInnerShadow)"/>
  <!-- 테두리 라인 -->
  <rect x="0.5" y="0.5" width="119" height="11" rx="5.5" ry="5.5"
        fill="none" stroke="#3a3a66" stroke-width="0.8" opacity="0.8"/>
  <!-- 내부 하이라이트 (상단 미세 밝기) -->
  <rect x="2" y="1.5" width="116" height="2" rx="1" ry="1"
        fill="#4466aa" opacity="0.12"/>
</svg>
