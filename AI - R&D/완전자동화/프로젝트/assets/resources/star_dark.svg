<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="darkStarGrad" cx="40%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#444444"/>
      <stop offset="40%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="darkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#880000" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#440000" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#220000" stop-opacity="0"/>
    </radialGradient>
    <filter id="darkStarGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redEdgeGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 붉은 외부 발광 (위협적) -->
  <circle cx="32" cy="32" r="31" fill="url(#darkGlow)"/>

  <!-- 별 모양 - 8각 (더 뾰족하게) -->
  <polygon points="32,2 35.5,20 50,8 40,24 60,26 44,33 58,44 40,42 44,60 32,50 20,60 24,42 6,44 20,33 4,26 24,24 14,8 28.5,20"
           fill="url(#darkStarGrad)" stroke="#cc0000" stroke-width="2" stroke-linejoin="round"
           filter="url(#darkStarGlow)"/>

  <!-- 붉은 테두리 발광 -->
  <polygon points="32,2 35.5,20 50,8 40,24 60,26 44,33 58,44 40,42 44,60 32,50 20,60 24,42 6,44 20,33 4,26 24,24 14,8 28.5,20"
           fill="none" stroke="#ff2200" stroke-width="1.5" stroke-linejoin="round" stroke-opacity="0.6"
           filter="url(#redEdgeGlow)"/>

  <!-- 중앙 어두운 코어 -->
  <circle cx="32" cy="32" r="8" fill="#000000" fill-opacity="0.9"/>
  <circle cx="32" cy="32" r="5" fill="#330000"/>

  <!-- 불길한 눈 모양 중앙 -->
  <ellipse cx="32" cy="32" rx="4" ry="3" fill="#550000"/>
  <ellipse cx="32" cy="32" rx="2" ry="2" fill="#cc0000" fill-opacity="0.8"/>

  <!-- 희미한 균열 느낌 라인 -->
  <line x1="32" y1="26" x2="32" y2="38" stroke="#440000" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="26" y1="32" x2="38" y2="32" stroke="#440000" stroke-width="0.8" stroke-opacity="0.5"/>
</svg>
