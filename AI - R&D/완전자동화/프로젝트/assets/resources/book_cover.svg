<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a3a"/>
      <stop offset="50%" stop-color="#050518"/>
      <stop offset="100%" stop-color="#000008"/>
    </linearGradient>
    <linearGradient id="coverSpine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0a3a"/>
      <stop offset="100%" stop-color="#0a1a3a"/>
    </linearGradient>
    <linearGradient id="borderGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe866"/>
      <stop offset="50%" stop-color="#ffc800"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <linearGradient id="titleGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe866"/>
      <stop offset="50%" stop-color="#ffc800"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <radialGradient id="nebulaGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4422dd" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#1a0a3a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000008" stop-opacity="0"/>
    </radialGradient>
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 책 본체 배경 -->
  <rect x="14" y="4" width="182" height="272" rx="6" ry="6" fill="url(#coverBg)"/>
  <!-- 책 등 (spine) -->
  <rect x="4" y="4" width="18" height="272" rx="4" ry="4" fill="url(#coverSpine)"/>
  <!-- 등 하이라이트 선 -->
  <line x1="10" y1="8" x2="10" y2="272" stroke="#9977ff" stroke-width="1" opacity="0.4"/>

  <!-- 성운 글로우 배경 -->
  <ellipse cx="105" cy="120" rx="80" ry="70" fill="url(#nebulaGlow)"/>

  <!-- 황금 테두리 -->
  <rect x="20" y="10" width="172" height="260" rx="4" ry="4"
        fill="none" stroke="url(#borderGold)" stroke-width="2"
        filter="url(#goldGlow)" opacity="0.9"/>
  <!-- 내부 이중 테두리 -->
  <rect x="24" y="14" width="164" height="252" rx="3" ry="3"
        fill="none" stroke="#ffd700" stroke-width="0.8" opacity="0.4"/>

  <!-- 배경 별들 (소형) -->
  <circle cx="40" cy="30" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="160" cy="25" r="1.2" fill="#b8ccff" opacity="0.8"/>
  <circle cx="75" cy="50" r="0.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="145" cy="55" r="1" fill="#b8ccff" opacity="0.6"/>
  <circle cx="55" cy="80" r="0.7" fill="#ffffff" opacity="0.4"/>
  <circle cx="170" cy="75" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="35" cy="200" r="1" fill="#b8ccff" opacity="0.5"/>
  <circle cx="175" cy="195" r="0.8" fill="#ffffff" opacity="0.7"/>
  <circle cx="130" cy="240" r="1" fill="#b8ccff" opacity="0.4"/>
  <circle cx="50" cy="250" r="0.8" fill="#ffffff" opacity="0.5"/>

  <!-- 중앙 메인 별 (8각) -->
  <g transform="translate(105, 115)" filter="url(#starGlow)">
    <!-- 별 광채 -->
    <circle cx="0" cy="0" r="32" fill="#4422dd" opacity="0.15"/>
    <circle cx="0" cy="0" r="22" fill="#6644ff" opacity="0.12"/>
    <!-- 8각 별 -->
    <polygon points="0,-28 5,-10 18,-18 10,-5 28,0 10,5 18,18 5,10 0,28 -5,10 -18,18 -10,5 -28,0 -10,-5 -18,-18 -5,-10"
             fill="url(#titleGold)" opacity="0.95"/>
    <!-- 중앙 원 -->
    <circle cx="0" cy="0" r="8" fill="#ffe866" opacity="0.9"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff" opacity="0.9"/>
    <!-- 빛 십자 -->
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#ffe866" stroke-width="1" opacity="0.4"/>
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#ffe866" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- 타이틀: "별자리 도감" -->
  <text x="105" y="178" font-family="serif" font-size="18" font-weight="bold"
        text-anchor="middle" fill="url(#titleGold)"
        filter="url(#textGlow)" letter-spacing="2">별자리 도감</text>

  <!-- 부제목 영문 -->
  <text x="105" y="198" font-family="serif" font-size="10"
        text-anchor="middle" fill="#ccbbff" opacity="0.8" letter-spacing="3">CONSTELLATION BOOK</text>

  <!-- 구분선 (황금) -->
  <line x1="45" y1="208" x2="165" y2="208" stroke="url(#borderGold)" stroke-width="1" opacity="0.7"/>

  <!-- 소형 별 장식 (구분선 양옆) -->
  <polygon points="42,208 44,204 46,208 44,212" fill="#ffc800" opacity="0.8"/>
  <polygon points="158,208 160,204 162,208 160,212" fill="#ffc800" opacity="0.8"/>

  <!-- 하단 설명 텍스트 -->
  <text x="105" y="230" font-family="serif" font-size="9"
        text-anchor="middle" fill="#8866dd" opacity="0.8" letter-spacing="1">Star Sweeper</text>

  <!-- 하단 장식 별 3개 -->
  <circle cx="90" cy="248" r="2" fill="#ffc800" opacity="0.6"/>
  <circle cx="105" cy="245" r="3" fill="#ffe866" opacity="0.8"/>
  <circle cx="120" cy="248" r="2" fill="#ffc800" opacity="0.6"/>

  <!-- 모서리 장식 (4코너) -->
  <g opacity="0.6" fill="#ffd700">
    <polygon points="28,18 32,18 28,22" />
    <polygon points="184,18 188,18 188,22" />
    <polygon points="28,258 28,262 32,262" />
    <polygon points="184,258 188,258 188,262" />
  </g>
</svg>
