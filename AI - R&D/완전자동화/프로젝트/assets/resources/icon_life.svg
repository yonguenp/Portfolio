<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <radialGradient id="heartGrad" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffe0a0"/>
      <stop offset="100%" stop-color="#ffa020"/>
    </radialGradient>
    <radialGradient id="lifeStarGrad" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ffe866"/>
      <stop offset="100%" stop-color="#ffc000"/>
    </radialGradient>
    <filter id="lifeGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 외부 부드러운 빛 -->
  <circle cx="24" cy="26" r="20" fill="#ffd700" fill-opacity="0.12"/>

  <!-- 하트 모양 (하단) -->
  <path d="M 24 40 C 24 40 6 28 6 18 C 6 12 10 8 15 8 C 18.5 8 21.5 10 24 13 C 26.5 10 29.5 8 33 8 C 38 8 42 12 42 18 C 42 28 24 40 24 40 Z"
        fill="url(#heartGrad)" stroke="#cc8800" stroke-width="1" filter="url(#lifeGlow)"/>

  <!-- 하트 하이라이트 -->
  <ellipse cx="18" cy="16" rx="5" ry="3.5" fill="white" fill-opacity="0.45" transform="rotate(-30, 18, 16)"/>

  <!-- 작은 별 (우측 상단) -->
  <g transform="translate(34, 10)" filter="url(#lifeGlow)">
    <polygon points="0,-7 1.8,-2.7 6.7,-2.2 3,1.1 4.1,6.5 0,3.5 -4.1,6.5 -3,1.1 -6.7,-2.2 -1.8,-2.7"
             fill="url(#lifeStarGrad)" stroke="#cc9900" stroke-width="0.8"/>
  </g>

  <!-- 별 내부 하이라이트 -->
  <g transform="translate(34, 10)">
    <ellipse cx="-1.5" cy="-3" rx="2.5" ry="1.8" fill="white" fill-opacity="0.5" transform="rotate(-20, -1.5, -3)"/>
  </g>
</svg>
