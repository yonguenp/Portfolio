<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="purpleStarGrad" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e8aaff"/>
      <stop offset="35%" stop-color="#aa22ff"/>
      <stop offset="100%" stop-color="#550088"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cc66ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8800cc" stop-opacity="0"/>
    </radialGradient>
    <filter id="starGlowPurple">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 외부 발광 -->
  <circle cx="32" cy="32" r="30" fill="url(#purpleGlow)"/>

  <!-- 별 모양 (5각) -->
  <polygon points="32,4 39,24 60,24 44,37 50,58 32,46 14,58 20,37 4,24 25,24"
           fill="url(#purpleStarGrad)" stroke="#7700bb" stroke-width="1.5" stroke-linejoin="round"
           filter="url(#starGlowPurple)"/>

  <!-- 광택 테두리 -->
  <polygon points="32,7 37.5,23 54,23 40.5,33.5 46,52 32,43 18,52 23.5,33.5 10,23 26.5,23"
           fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.35" stroke-linejoin="round"/>

  <!-- 중앙 밝은 하이라이트 -->
  <ellipse cx="27" cy="24" rx="7" ry="5" fill="white" fill-opacity="0.38" transform="rotate(-20, 27, 24)"/>
</svg>
