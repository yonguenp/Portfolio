<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="lockedBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f0f28"/>
      <stop offset="100%" stop-color="#050518"/>
    </radialGradient>
    <linearGradient id="lockedBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a55"/>
      <stop offset="100%" stop-color="#111133"/>
    </linearGradient>
    <filter id="lockedGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect x="4" y="4" width="112" height="112" rx="10" ry="10" fill="url(#lockedBg)"/>
  <!-- 테두리 -->
  <rect x="4" y="4" width="112" height="112" rx="10" ry="10"
        fill="none" stroke="url(#lockedBorder)" stroke-width="2" opacity="0.9"/>
  <!-- 내부 이중 테두리 -->
  <rect x="8" y="8" width="104" height="104" rx="8" ry="8"
        fill="none" stroke="#1a1a44" stroke-width="1" opacity="0.6"/>

  <!-- 물음표 기호 -->
  <text x="60" y="72" font-family="serif" font-size="52" font-weight="bold"
        text-anchor="middle" fill="#2a2a55" opacity="0.9"
        filter="url(#lockedGlow)">?</text>

  <!-- 물음표 위에 얇은 흰색 레이어 (가독성) -->
  <text x="60" y="72" font-family="serif" font-size="52" font-weight="bold"
        text-anchor="middle" fill="#4466aa" opacity="0.6">?</text>

  <!-- 잠금 아이콘 (하단 중앙) -->
  <g transform="translate(60, 95)" opacity="0.5">
    <!-- 자물쇠 몸체 -->
    <rect x="-8" y="-5" width="16" height="12" rx="2" ry="2" fill="#2a2a55"/>
    <!-- 자물쇠 고리 -->
    <path d="M -5,-5 C -5,-11 5,-11 5,-5" fill="none"
          stroke="#2a2a55" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 열쇠 구멍 -->
    <circle cx="0" cy="1" r="2" fill="#050518"/>
  </g>

  <!-- 배경 소형 별 (희미) -->
  <circle cx="20" cy="20" r="1" fill="#4466aa" opacity="0.3"/>
  <circle cx="100" cy="25" r="1" fill="#4466aa" opacity="0.2"/>
  <circle cx="15" cy="95" r="0.8" fill="#4466aa" opacity="0.25"/>
  <circle cx="105" cy="90" r="1" fill="#4466aa" opacity="0.3"/>
</svg>
