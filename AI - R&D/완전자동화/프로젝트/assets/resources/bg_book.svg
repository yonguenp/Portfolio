    <circle cx="555" cy="525" r="1.3"/>
    <circle cx="775" cy="545" r="1.1"/>
    <circle cx="920" cy="530" r="1"/>
  </g>

  <!-- 밝은 별 (강조) -->
  <g opacity="0.8" fill="#ffffff">
    <circle cx="240" cy="160" r="1.8"/>
    <circle cx="480" cy="80" r="1.5"/>
    <circle cx="720" cy="170" r="1.8"/>
    <circle cx="360" cy="450" r="1.5"/>
    <circle cx="600" cy="420" r="1.8"/>
  </g>

  <!-- 은하수 밴드 (대각선 희미한 선형 광채) -->
  <rect x="-100" y="180" width="1200" height="60" rx="30"
        fill="#b8ccff" opacity="0.025" transform="rotate(-8, 480, 320)"/>
  <rect x="-100" y="210" width="1200" height="30" rx="15"
        fill="#ffffff" opacity="0.015" transform="rotate(-8, 480, 320)"/>

  <!-- 상단 장식 라인 (도감 분위기) -->
  <line x1="0" y1="72" x2="960" y2="72" stroke="#ffd700" stroke-width="0.5" opacity="0.12"/>
  <!-- 하단 장식 라인 -->
  <line x1="0" y1="568" x2="960" y2="568" stroke="#ffd700" stroke-width="0.5" opacity="0.12"/>
