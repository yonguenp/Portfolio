<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <defs>
    <linearGradient id="bgBookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a3a"/>
      <stop offset="40%" stop-color="#080820"/>
      <stop offset="100%" stop-color="#050518"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="30%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#1a0a3a" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0a1a3a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050518" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="75%" cy="65%" r="35%">
      <stop offset="0%" stop-color="#0a1a3a" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#1a0a3a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050518" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="centerLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6644ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#050518" stop-opacity="0"/>
    </radialGradient>
    <filter id="starBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- 베이스 배경 -->
  <rect width="960" height="640" fill="url(#bgBookGrad)"/>

  <!-- 성운 광채 레이어 -->
  <ellipse cx="288" cy="224" rx="380" ry="250" fill="url(#nebula1)"/>
  <ellipse cx="720" cy="416" rx="340" ry="224" fill="url(#nebula2)"/>
  <!-- 중앙 은은한 글로우 -->
  <ellipse cx="480" cy="320" rx="480" ry="320" fill="url(#centerLight)"/>

  <!-- 배경 별 (원거리, 매우 희미) -->
  <g opacity="0.35" fill="#b8ccff">
    <circle cx="48" cy="32" r="1"/>
    <circle cx="128" cy="64" r="0.8"/>
    <circle cx="200" cy="20" r="1.2"/>
    <circle cx="310" cy="48" r="0.9"/>
    <circle cx="425" cy="28" r="1"/>
    <circle cx="540" cy="56" r="0.8"/>
    <circle cx="660" cy="18" r="1.1"/>
    <circle cx="780" cy="44" r="0.9"/>
    <circle cx="890" cy="30" r="1"/>
    <circle cx="920" cy="70" r="0.8"/>
    <circle cx="80" cy="120" r="1"/>
    <circle cx="175" cy="150" r="0.7"/>
    <circle cx="300" cy="130" r="1.1"/>
    <circle cx="440" cy="110" r="0.8"/>
