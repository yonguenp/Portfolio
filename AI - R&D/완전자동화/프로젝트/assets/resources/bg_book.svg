    <circle cx="680" cy="385" r="0.8"/>
    <circle cx="800" cy="365" r="1"/>
    <circle cx="930" cy="390" r="0.9"/>
    <circle cx="70" cy="480" r="0.8"/>
    <circle cx="210" cy="500" r="1"/>
    <circle cx="350" cy="475" r="0.9"/>
    <circle cx="490" cy="495" r="1.1"/>
    <circle cx="630" cy="480" r="0.8"/>
    <circle cx="765" cy="500" r="1"/>
    <circle cx="895" cy="485" r="0.9"/>
    <circle cx="40" cy="580" r="1"/>
    <circle cx="180" cy="610" r="0.8"/>
    <circle cx="320" cy="590" r="1"/>
