    <circle cx="600" cy="600" r="1.1"/>
    <circle cx="740" cy="618" r="0.8"/>
    <circle cx="860" cy="595" r="1"/>
  </g>

  <!-- 중간 별 (약간 밝은) -->
  <g opacity="0.55" fill="#ffffff">
    <circle cx="95" cy="78" r="1.2"/>
    <circle cx="265" cy="95" r="1"/>
    <circle cx="455" cy="72" r="1.3"/>
    <circle cx="640" cy="88" r="1.1"/>
