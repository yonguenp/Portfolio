    <circle cx="335" cy="230" r="0.8"/>
    <circle cx="475" cy="250" r="1.1"/>
    <circle cx="620" cy="235" r="0.9"/>
    <circle cx="755" cy="255" r="1"/>
    <circle cx="875" cy="240" r="0.8"/>
    <circle cx="30" cy="360" r="1"/>
    <circle cx="155" cy="380" r="0.8"/>
    <circle cx="285" cy="350" r="1.1"/>
    <circle cx="415" cy="375" r="0.9"/>
