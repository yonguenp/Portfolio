<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <radialGradient id="slotBlueFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%"  stop-color="#90c8ff"/>
      <stop offset="55%" stop-color="#1a7fff"/>
      <stop offset="100%" stop-color="#003a99"/>
    </radialGradient>
    <radialGradient id="slotBlueGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#4488ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0033cc" stop-opacity="0"/>
    </radialGradient>
    <filter id="blueGlowFilter" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#1a7fff" flood-opacity="0.6" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 외부 글로우 -->
  <circle cx="20" cy="20" r="19" fill="url(#slotBlueGlow)"/>
  <!-- 슬롯 배경 원 -->
  <circle cx="20" cy="20" r="17"
          fill="#080820"
          stroke="#0033cc" stroke-width="2.5"/>
  <!-- 채워진 색상 원 -->
  <circle cx="20" cy="20" r="13"
          fill="url(#slotBlueFill)"
          filter="url(#blueGlowFilter)"/>
  <!-- 내부 하이라이트 -->
  <ellipse cx="16" cy="15" rx="4" ry="3"
           fill="#ffffff" opacity="0.25"/>
  <!-- 중앙 소형 별 심볼 -->
  <polygon points="20,13 21.5,17.5 26.5,17.5 22.5,20.5 24,25 20,22 16,25 17.5,20.5 13.5,17.5 18.5,17.5"
           fill="#ffffff" opacity="0.55"/>
</svg>
