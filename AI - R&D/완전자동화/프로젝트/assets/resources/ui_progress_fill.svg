<svg xmlns="http://www.w3.org/2000/svg" width="120" height="12" viewBox="0 0 120 12">
  <defs>
    <linearGradient id="progressFillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffe866"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="75%" stop-color="#ffb800"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <linearGradient id="progressShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="fillGlow" x="-3%" y="-20%" width="106%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- 채움 그래픽 메인 (황금 그라디언트) -->
  <rect x="0" y="0" width="120" height="12" rx="6" ry="6"
        fill="url(#progressFillGrad)" filter="url(#fillGlow)"/>
  <!-- 상단 하이라이트 (광택) -->
  <rect x="1" y="1" width="118" height="5" rx="4" ry="4"
        fill="url(#progressShine)"/>
  <!-- 테두리 -->
  <rect x="0.5" y="0.5" width="119" height="11" rx="5.5" ry="5.5"
        fill="none" stroke="#ffc800" stroke-width="0.6" opacity="0.7"/>
  <!-- 끝단 스파클 포인트 -->
  <circle cx="114" cy="6" r="2" fill="#ffe866" opacity="0.8"/>
  <circle cx="114" cy="6" r="3.5" fill="none" stroke="#ffe866" stroke-width="0.5" opacity="0.4"/>
</svg>
