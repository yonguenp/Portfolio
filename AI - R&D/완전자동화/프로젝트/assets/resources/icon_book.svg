<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <linearGradient id="bookBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6644ff"/>
      <stop offset="100%" stop-color="#2200aa"/>
    </linearGradient>
    <linearGradient id="bookGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe866"/>
      <stop offset="100%" stop-color="#ffc800"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4422dd"/>
      <stop offset="100%" stop-color="#1a0a3a"/>
    </linearGradient>
    <filter id="bookGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="iconGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 원형 버튼 배경 -->
  <circle cx="30" cy="30" r="28" fill="url(#bookBg)" opacity="0.92"/>
  <!-- 테두리 -->
  <circle cx="30" cy="30" r="28" fill="none" stroke="#9977ff" stroke-width="1.5" opacity="0.8"/>
  <circle cx="30" cy="30" r="26" fill="none" stroke="#6644ff" stroke-width="0.5" opacity="0.4"/>

  <!-- 책 몸체 (오른쪽 커버) -->
  <rect x="18" y="14" width="22" height="30" rx="2" ry="2" fill="url(#coverGrad)"
        filter="url(#iconGlow)"/>
  <!-- 책 표지 테두리 (황금) -->
  <rect x="18" y="14" width="22" height="30" rx="2" ry="2"
        fill="none" stroke="url(#bookGold)" stroke-width="1.2" opacity="0.9"/>

  <!-- 책 등 (spine) -->
  <rect x="14" y="14" width="6" height="30" rx="2" ry="2" fill="#1a0a3a"/>
  <rect x="14" y="14" width="6" height="30" rx="2" ry="2"
        fill="none" stroke="#ffc800" stroke-width="0.8" opacity="0.7"/>
  <!-- 등 하이라이트 -->
  <line x1="16" y1="16" x2="16" y2="42" stroke="#9977ff" stroke-width="0.8" opacity="0.5"/>

  <!-- 책 표지 안 선들 (텍스트 라인 표현) -->
  <line x1="21" y1="22" x2="37" y2="22" stroke="#ccbbff" stroke-width="0.8" opacity="0.6"/>
  <line x1="21" y1="26" x2="34" y2="26" stroke="#ccbbff" stroke-width="0.8" opacity="0.4"/>
  <line x1="21" y1="30" x2="36" y2="30" stroke="#ccbbff" stroke-width="0.8" opacity="0.4"/>

  <!-- 책 위 소형 별 장식 -->
  <g transform="translate(34, 17)" filter="url(#bookGlow)">
    <polygon points="0,-5 1.5,-2 4,-2 2,0 3,3 0,1.5 -3,3 -2,0 -4,-2 -1.5,-2"
             fill="url(#bookGold)" opacity="0.95"/>
  </g>

  <!-- 우측 하단 소형 스파클 -->
  <g opacity="0.8">
    <circle cx="42" cy="40" r="1.5" fill="#ffe866" filter="url(#bookGlow)"/>
    <line x1="42" y1="36" x2="42" y2="38" stroke="#ffe866" stroke-width="0.8" opacity="0.7"/>
    <line x1="42" y1="42" x2="42" y2="44" stroke="#ffe866" stroke-width="0.8" opacity="0.7"/>
    <line x1="38" y1="40" x2="40" y2="40" stroke="#ffe866" stroke-width="0.8" opacity="0.7"/>
    <line x1="44" y1="40" x2="46" y2="40" stroke="#ffe866" stroke-width="0.8" opacity="0.7"/>
  </g>
</svg>
