<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <radialGradient id="slotGreenFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%"  stop-color="#aaffaa"/>
      <stop offset="55%" stop-color="#00cc44"/>
      <stop offset="100%" stop-color="#006622"/>
    </radialGradient>
    <radialGradient id="slotGreenGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#44ff88" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#009933" stop-opacity="0"/>
    </radialGradient>
    <filter id="greenGlowFilter" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#00cc44" flood-opacity="0.6" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 외부 글로우 -->
  <circle cx="20" cy="20" r="19" fill="url(#slotGreenGlow)"/>
  <!-- 슬롯 배경 원 -->
  <circle cx="20" cy="20" r="17"
          fill="#001a08"
          stroke="#009933" stroke-width="2.5"/>
  <!-- 채워진 색상 원 -->
  <circle cx="20" cy="20" r="13"
          fill="url(#slotGreenFill)"
          filter="url(#greenGlowFilter)"/>
  <!-- 내부 하이라이트 -->
  <ellipse cx="16" cy="15" rx="4" ry="3"
           fill="#ffffff" opacity="0.25"/>
  <!-- 중앙 소형 별 심볼 -->
  <polygon points="20,13 21.5,17.5 26.5,17.5 22.5,20.5 24,25 20,22 16,25 17.5,20.5 13.5,17.5 18.5,17.5"
           fill="#ffffff" opacity="0.55"/>
</svg>
